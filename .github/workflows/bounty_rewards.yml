name: COFC Automated Bounty & Rewards

on:
  pull_request:
    types: [closed]

jobs:
  reward_contributor:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Contributor Reward
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Merging PR approved for contributor: $AUTHOR"
          echo "Executing smart settlement protocol for task: '$PR_TITLE'"
          echo "Status: SUCCESS - CASH/TIME tokens allocated to vault for $AUTHOR."
